<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">WRDLINK campaign scoring example</title><desc id="d">A run begins at 25 points. Two hints cost 5 and 6 plus one move point each. Level completion adds 25. The next level uses hint 3 at 7 plus one move point.</desc><rect width="1200" height="360" rx="24" fill="#172322"/><text x="54" y="58" fill="#f4f0e7" font-family="Arial" font-size="25" font-weight="700" letter-spacing="2">SCORING ACROSS LEVELS</text><g font-family="Arial" text-anchor="middle" font-weight="800"><g><rect x="55" y="112" width="190" height="112" rx="15" fill="#e9e3d5"/><text x="150" y="151" fill="#425957" font-size="15">NEW RUN</text><text x="150" y="197" fill="#172322" font-size="42">25</text></g><g><rect x="285" y="112" width="190" height="112" rx="15" fill="#287f73"/><text x="380" y="151" fill="#fff" font-size="15">HINT 1 + MOVE</text><text x="380" y="197" fill="#fff" font-size="35">−6</text></g><g><rect x="515" y="112" width="190" height="112" rx="15" fill="#287f73"/><text x="610" y="151" fill="#fff" font-size="15">HINT 2 + MOVE</text><text x="610" y="197" fill="#fff" font-size="35">−7</text></g><g><rect x="745" y="112" width="190" height="112" rx="15" fill="#d5a34d"/><text x="840" y="151" fill="#33230b" font-size="15">LEVEL COMPLETE</text><text x="840" y="197" fill="#33230b" font-size="35">+25</text></g><g><rect x="975" y="112" width="170" height="112" rx="15" fill="#e9e3d5"/><text x="1060" y="151" fill="#425957" font-size="15">LEVEL 2</text><text x="1060" y="197" fill="#172322" font-size="35">HINT 3</text></g></g><path d="M245 168h34m-10-10 10 10-10 10M475 168h34m-10-10 10 10-10 10M705 168h34m-10-10 10 10-10 10M935 168h34m-10-10 10 10-10 10" fill="none" stroke="#d5a34d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="285" fill="#f4f0e7" font-family="Arial" font-size="21" font-weight="700">Hint prices never reset between levels.</text><text x="56" y="325" fill="#c4d0c8" font-family="Arial" font-size="17">5, 6, 7, 8 ... · each confirmed hint also submits a move costing 1 point.</text></svg>