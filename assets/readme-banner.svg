  <text x="76" y="278" fill="#c4d0c8" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" letter-spacing="3">THINK SHARP. LINK WORDS.</text>
  <text x="76" y="322" fill="#d5a34d" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">A FOUR LETTER WORD LADDER</text>
