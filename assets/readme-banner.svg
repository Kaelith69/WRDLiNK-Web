  <rect width="1200" height="360" rx="28" fill="#172322"/>
  <circle cx="1080" cy="42" r="190" fill="#263b36"/>
  <circle cx="1080" cy="42" r="128" fill="none" stroke="#476057" stroke-width="2"/>
  <g transform="translate(72 76)">
    <g fill="#e9e3d5" stroke="#0d1716" stroke-width="5">
      <rect x="0" y="0" width="82" height="82" rx="14"/>
      <rect x="94" y="0" width="82" height="82" rx="14"/>
      <rect x="188" y="0" width="82" height="82" rx="14"/>
      <rect x="282" y="0" width="82" height="82" rx="14"/>
    </g>
    <g fill="#172322" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" text-anchor="middle">
      <text x="41" y="57">W</text><text x="135" y="57">O</text><text x="229" y="57">R</text><text x="323" y="57">D</text>
