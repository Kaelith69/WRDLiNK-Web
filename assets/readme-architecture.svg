<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="t d"><title id="t">WRDLINK application architecture</title><desc id="d">The browser loads HTML, CSS, app logic, and a bundled dictionary. It validates moves, searches the word graph, stores progress locally, and caches the app shell for offline use.</desc><rect width="1200" height="310" rx="24" fill="#172322"/><text x="54" y="56" fill="#f4f0e7" font-family="Arial" font-size="25" font-weight="700" letter-spacing="2">BROWSER FIRST ARCHITECTURE</text><g font-family="Arial" text-anchor="middle" font-weight="700"><g fill="#e9e3d5"><rect x="50" y="112" width="205" height="94" rx="14"/><rect x="330" y="112" width="205" height="94" rx="14"/><rect x="610" y="112" width="205" height="94" rx="14"/><rect x="890" y="112" width="250" height="94" rx="14"/></g><g fill="#172322" font-size="19"><text x="152" y="151">HTML + CSS</text><text x="152" y="178" font-size="14">Interface</text><text x="432" y="151">app.js</text><text x="432" y="178" font-size="14">Rules + algorithms</text><text x="712" y="151">localStorage</text><text x="712" y="178" font-size="14">Progress + theme</text><text x="1015" y="151">Service worker</text><text x="1015" y="178" font-size="14">Offline app shell</text></g></g><g stroke="#d5a34d" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M255 159h65m-12-12 12 12-12 12M535 159h65m-12-12 12 12-12 12M815 159h65m-12-12 12 12-12 12"/></g><rect x="330" y="245" width="485" height="48" rx="12" fill="#287f73"/><text x="572" y="276" fill="#fff" font-family="Arial" font-size="17" font-weight="700" text-anchor="middle">dictionary.js · 3,889 four letter words</text><path d="M432 206v20h140v19" fill="none" stroke="#c4d0c8" stroke-width="3"/></svg>