<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d"><title id="t">Breadth first search explores word neighbors</title><desc id="d">BFS explores the start, then all words one move away, then the next layer until it reaches the target.</desc><rect width="1200" height="390" rx="24" fill="#172322"/><text x="54" y="58" fill="#f4f0e7" font-family="Arial" font-size="25" font-weight="700" letter-spacing="2">BREADTH FIRST SEARCH</text><g stroke="#71877d" stroke-width="4" fill="none"><path d="M600 145L260 245M600 145L600 245M600 145L940 245M260 278L130 345M260 278L390 345M600 278L520 345M600 278L680 345M940 278L850 345M940 278L1060 345"/></g><g font-family="Arial" font-weight="800" text-anchor="middle"><rect x="520" y="92" width="160" height="62" rx="14" fill="#d5a34d"/><text x="600" y="132" fill="#172322" font-size="25">START</text><rect x="180" y="245" width="160" height="62" rx="14" fill="#287f73"/><rect x="520" y="245" width="160" height="62" rx="14" fill="#287f73"/><rect x="860" y="245" width="160" height="62" rx="14" fill="#287f73"/><g fill="#fff" font-size="19"><text x="260" y="283">NEIGHBOR A</text><text x="600" y="283">NEIGHBOR B</text><text x="940" y="283">NEIGHBOR C</text></g><g fill="#e9e3d5"><rect x="65" y="345" width="130" height="35" rx="8"/><rect x="325" y="345" width="130" height="35" rx="8"/><rect x="455" y="345" width="130" height="35" rx="8"/><rect x="615" y="345" width="130" height="35" rx="8"/><rect x="785" y="345" width="130" height="35" rx="8"/><rect x="995" y="345" width="130" height="35" rx="8"/></g><g fill="#172322" font-size="13"><text x="130" y="368">NEXT LAYER</text><text x="390" y="368">NEXT LAYER</text><text x="520" y="368">NEXT LAYER</text><text x="680" y="368">NEXT LAYER</text><text x="850" y="368">NEXT LAYER</text><text x="1060" y="368">TARGET</text></g></g></svg>