<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="t d"><title id="t">A legal WRDLINK word ladder</title><desc id="d">COLD changes to CORD, CARD, WARD, and WARM, one letter at a time.</desc><rect width="1200" height="310" rx="24" fill="#172322"/><text x="56" y="58" fill="#f4f0e7" font-family="Arial" font-size="24" font-weight="700" letter-spacing="3">ONE LETTER PER MOVE</text><g font-family="Arial" font-size="35" font-weight="800" text-anchor="middle"><g fill="#e9e3d5"><rect x="52" y="105" width="170" height="82" rx="14"/><rect x="292" y="105" width="170" height="82" rx="14"/><rect x="532" y="105" width="170" height="82" rx="14"/><rect x="772" y="105" width="170" height="82" rx="14"/></g><rect x="1012" y="105" width="136" height="82" rx="14" fill="#d5a34d"/><g fill="#172322"><text x="137" y="158">COLD</text><text x="377" y="158">CORD</text><text x="617" y="158">CARD</text><text x="857" y="158">WARD</text><text x="1080" y="158">WARM</text></g></g><g stroke="#d5a34d" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M230 146h48m-12-12 12 12-12 12"/><path d="M470 146h48m-12-12 12 12-12 12"/><path d="M710 146h48m-12-12 12 12-12 12"/><path d="M950 146h48m-12-12 12 12-12 12"/></g><g fill="#c4d0c8" font-family="Arial" font-size="16" text-anchor="middle"><text x="137" y="225">START</text><text x="377" y="225">MOVE 1</text><text x="617" y="225">MOVE 2</text><text x="857" y="225">MOVE 3</text><text x="1080" y="225">TARGET</text></g><text x="56" y="278" fill="#d5a34d" font-family="Arial" font-size="16" font-weight="700">4 VALID MOVES · 5 WORDS · NO REPEATS</text></svg>