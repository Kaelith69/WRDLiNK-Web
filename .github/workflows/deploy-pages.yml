name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare static site
        run: |
          mkdir -p _site/assets
          cp index.html styles.css app.js dictionary.js manifest.webmanifest sw.js _site/
          cp assets/wrdlink-icon.svg _site/assets/
          sudo apt-get update
          sudo apt-get install --yes librsvg2-bin
          rsvg-convert --width 192 --height 192 assets/wrdlink-icon.svg --output _site/assets/wrdlink-icon-192.png
          rsvg-convert --width 512 --height 512 assets/wrdlink-icon.svg --output _site/assets/wrdlink-icon-512.png
          rsvg-convert --width 180 --height 180 assets/wrdlink-icon.svg --output _site/assets/wrdlink-icon-180.png
          file _site/assets/wrdlink-icon-192.png _site/assets/wrdlink-icon-512.png _site/assets/wrdlink-icon-180.png
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
